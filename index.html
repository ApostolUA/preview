<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: modelled on Luma — calm page, filter panel left, events as rows with a square picture, click opens the full card; "Створити подію" in the top bar. Light = soft grey page, dark = deep navy. Blue for actions, yellow only for the logo mark and the "today" marker. */
:root{

  --bg:#faf7f0; --card:#ffffff; --card-2:#f2ede2; --line:#e8e1d2;
  --fg:#131517; --muted:#75706a; --blue:#0057b7; --on-blue:#ffffff; --blue-soft:#e7effa;
  --flag-blue:#0057b7; --flag-yellow:#ffd500;
  --gold:#ffd23f; --gold-ink:#2a2100; --err:#c62828;
  --font:"Manrope","Noto Sans",Arial,sans-serif;
  --r:14px; --r-sm:10px;
  --cal-ink:#0057b7;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1f; --card:#2a2a2a; --card-2:#333333; --line:#3d3d3d;
  --fg:#f2f2f2; --muted:#a8a8a8; --blue:#4d8dff; --on-blue:#ffffff; --blue-soft:#1c3a6b; --err:#ff8a80; --flag-blue:#2f86ff; --cal-ink:#d6e4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1f1f; --card:#2a2a2a; --card-2:#333333; --line:#3d3d3d;
  --fg:#f2f2f2; --muted:#a8a8a8; --blue:#4d8dff; --on-blue:#ffffff; --blue-soft:#1c3a6b; --err:#ff8a80; --flag-blue:#2f86ff; --cal-ink:#d6e4ff; color-scheme:dark}
/* theme button: moon in light theme, sun in dark */
.theme{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.theme:hover{border-color:var(--muted)}
.acct.on{color:var(--blue);border-color:var(--blue)}
.rv{position:relative}.rv b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--flag-yellow);color:#0b1d3a;font-size:11px;line-height:18px;padding:0 4px}
.rq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rq li{background:var(--card-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.rq li span{color:var(--muted);font-size:13px}.rq .k{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.rq .actions{margin-top:8px}
.rq .pv summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13.5px;margin-top:6px}
.pvc{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.pvc .thumb{width:72px;height:72px}.pvc>div{display:flex;flex-direction:column;gap:4px;min-width:0}.pvc p{margin:0}
.rej{margin-top:8px;display:flex;flex-direction:column;gap:8px}.rej .chips{display:flex;flex-direction:column;gap:6px}
.rej input#rej-other{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.undo{background:var(--card-2);border-radius:8px;padding:10px 14px;font-size:14px}.rq .city{font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.theme .sun,:root[data-theme="dark"] .theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}


/* top bar */
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
/* logo: text only, "apostol" flag blue, ".ua" flag yellow */
.logo{font-weight:800;font-size:30px;line-height:1;letter-spacing:-.01em;white-space:nowrap;text-decoration:none;color:var(--flag-blue)}
.logo .u{color:var(--flag-yellow)}
@media (max-width:560px){.logo{font-size:22px}.bar .lg{display:none}.bar nav{gap:4px}.bar .wrap{gap:8px}.bar .btn{padding-inline:10px}.theme{width:34px;height:34px}}
@media (max-width:360px){.logo{font-size:19px}.bar .sm{display:none}.bar .btn{padding-inline:12px;font-size:18px}}
.mark{width:28px;height:28px;border-radius:8px;background:var(--blue);display:grid;place-items:center}
.mark svg{display:block}
.bar nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{white-space:nowrap;border:0;border-radius:8px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--blue);color:var(--on-blue);display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card-2);color:var(--fg)}

/* page head */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* banner slider: place for ads (books, live broadcasts...); changes every 6 s, pauses on hover */
.banner{position:relative;margin-top:8px;border-radius:14px;overflow:hidden;height:210px;background:var(--card-2)}
.slide{position:absolute;inset:0;display:flex;align-items:stretch;gap:28px;padding:22px 64px 36px;color:#fff;visibility:hidden;transform:translateX(100%)}
.slide.on,.slide.out{visibility:visible;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.slide.on{transform:none}
.slide.out,.banner.back .slide:not(.on){transform:translateX(-100%)}
.banner.back .slide.out{transform:translateX(100%)}
.slide .art{flex:none;height:100%}
.slide .art img{display:block;height:100%;width:auto;max-width:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.slide .tx{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-width:0}
.slide .tag{display:inline-block;padding:2px 8px;border-radius:5px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700}
.slide .tag.sale{background:var(--flag-yellow);color:#0b1d3a}
.slide .buy{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.slide .pr{font-weight:800;font-size:17px;white-space:nowrap}.slide .pr s{font-weight:500;font-size:14px;opacity:.75;margin-left:4px}
.slide h3{margin:0;font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.slide p{margin:0;opacity:.85;max-width:56ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .go{display:inline-block;background:#fff;color:#0b1d3a;border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px;text-decoration:none}
.slide .ad{position:absolute;top:10px;right:14px;font-size:11px;opacity:.7;letter-spacing:.04em}
.bnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.bnav:hover{background:rgba(255,255,255,.3)}
.bnav.prev{left:14px}.bnav.next{right:14px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots button{position:relative;overflow:hidden;width:8px;height:8px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer;transition:width .4s ease}
.dots button[aria-current="true"]{width:30px}
/* the current dot fills up like a progress bar; when it is full the next slide comes (see animationend) */
.dots button[aria-current="true"]::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 6s linear forwards}
.banner:hover .dots button::after,.banner:focus-within .dots button::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:640px){.banner{height:220px}.slide{padding:26px 18px 34px;gap:14px}.slide .ad{top:7px}.slide .tag{font-size:11px}.slide .pr{font-size:15px}.slide .pr s{display:none}.slide h3{font-size:18px}.slide p{font-size:13px}.bnav{display:none}}
@media (prefers-reduced-motion:reduce){.slide,.slide.on,.slide.out{transition:none}.dots button{transition:none}.dots button[aria-current="true"]::after{animation:none;transform:none}}

.main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start;padding-block:22px 64px}

.reset{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-size:13.5px;align-self:flex-start}
/* calendar: days that have any announcement or news are tinted blue; picked days are solid blue; today has a yellow ring */
.cal{display:flex;flex-direction:column;gap:6px}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-size:14px;font-weight:700}

/* map under the calendar: a small preview; the button opens it full screen */
.mini{position:relative;height:170px;border-radius:var(--r-sm);overflow:hidden;background:var(--card-2);border:1px solid var(--line)}

.pop{display:flex;flex-direction:column;gap:10px;font:14px/1.4 var(--font);min-width:200px}

  if (skip!=='path' && !inPath(it,S.path)) return false;

  if (skip!=='topic' && S.topics.size && !S.topics.has(it.topic)) return false;

const litCount = () => litDays().reduce((n,[,r])=>n+r.length,0);
function litHTML(){
  const ds=litDays();

    +`</div></section>`;

const sameP = p => p.length===S.path.length && p.every((k,i)=>S.path[i]===k);

function placeOpts(){
  const o=[];
  for (const [ck,c] of Object.entries(PLACES)){
    o.push({p:[ck], label:c.n, sub:'країна'});
    for (const [ik,ci] of Object.entries(c.c)){
      o.push({p:[ck,ik], label:ci.n, sub:c.n});
      for (const [pk,pn] of Object.entries(ci.p)) o.push({p:[ck,ik,pk], label:pn, sub:ci.n+', '+c.n});
    }
  }
  return o;
}
function whereOpts(){
  const q=S.whereQ.toLowerCase();
  return placeOpts().filter(o => !q || (o.label+' '+o.sub).toLowerCase().includes(q));
}
function whereHTML(){
  const cur = S.path.length ? pathName(S.path).join(' › ') : '';
  const opts = whereOpts();
  const list = S.whereOpen ? `<ul class="opts" id="where-list">`+(opts.length ? opts.map(o=>`<li><button data-act="go" data-k="${o.p.join('/')}"><span>${esc(o.label)}<br><small>${esc(o.sub)}</small></span><span class="cnt">${countPath(o.p)}</span></button></li>`).join('') : `<li class="nohit">Такого місця ще немає</li>`)+`</ul>` : '';
  return `<div><div class="combo"><input class="search" id="where" type="text" aria-label="Де" autocomplete="off" role="combobox" aria-expanded="${S.whereOpen}" aria-controls="where-list" placeholder="Де: країна, місто чи парафія" value="${esc(S.whereOpen ? S.whereQ : cur)}">`
   +(cur && !S.whereOpen ? `<button class="clr" data-act="go" data-k="" aria-label="Усі країни">×</button>` : '')+list+`</div></div>`;
}
function filtersHTML(){
  const nf = ITEMS.filter(it=>match(it,'fut')&&it.fut).length, np = ITEMS.filter(it=>match(it,'fut')&&!it.fut).length;
  const topicCnt = t => ITEMS.filter(it=>match(it,'topic')&&it.topic===t).length;

  if (S.lit) return whereHTML() + seg

   +`<p class="lnote">Розклад з сайтів і бюлетенів парафій, перевірено ${LIT_CHECKED}. На свята, у піст і влітку час буває інший.</p>`
   +`<button class="reset" data-act="reset">Скинути всі фільтри</button>`;

   +`<button class="reset" data-act="reset">Скинути всі фільтри</button>`+calHTML()+miniHTML();
}
const MONN = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
function calHTML(){
  const y=S.calM.getFullYear(), m=S.calM.getMonth(), lead=(new Date(y,m,1).getDay()+6)%7, nd=new Date(y,m+1,0).getDate();
  // days with anything that fits the other filters
  const has=new Set(); ITEMS.filter(it=>match(it,'date')).forEach(it=>{ const [a,b]=span(it); for(let n=a;n<=b;n++) has.add(n); });
  let g=['пн','вт','ср','чт','пт','сб','нд'].map(w=>`<i>${w}</i>`).join('')+'<span></span>'.repeat(lead);
  for (let d=1; d<=nd; d++){
    const n=days(new Date(y,m,d)), on=S.d1!=null && n>=S.d1 && n<=(S.d2??S.d1);
    g+=`<button type="button" data-act="day" data-n="${n}" class="${has.has(n)?'has':''}${n===0?' tod':''}" aria-pressed="${on}" aria-label="${d} ${MON[m]}${n===0?', сьогодні':''}${has.has(n)?', є події':''}">${d}</button>`;
  }
  return `<div class="cal"><div class="cal-h"><button type="button" data-act="calm" data-k="-1" aria-label="Попередній місяць">‹</button><b>${MONN[m]} ${y}</b><button type="button" data-act="calm" data-k="1" aria-label="Наступний місяць">›</button></div>`
   +`<div class="cal-g">${g}</div><small>${S.d1==null?'Натисніть день або два дні, щоб вибрати проміжок.':`Вибрано: ${dateLbl()}<br>`+(S.d2==null?'Натисніть ще день, щоб вибрати проміжок.':'Натисніть день, щоб почати знову.')}</small></div>`;
}
const dShort = d => `${d.getDate()} ${MONS2[d.getMonth()]}${yr(d)}`;
function dateLbl(){
  const a=dayDate(S.d1); if (S.d2==null) return dShort(a);
  const b=dayDate(S.d2); return a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear() ? `${a.getDate()}–${dShort(b)}` : `${dShort(a)} – ${dShort(b)}`;

const shipCover = () => `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Апостол"><defs><linearGradient id="gship" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3d91"/><stop offset="1" stop-color="#3f7fe0"/></linearGradient></defs><rect width="100" height="100" fill="url(#gship)"/><image href="${SHIP}" x="24" y="22" width="52" height="51"/></svg>`;
function cover(topic){
  const [a,b,art] = COVER[topic] || COVER['Свята'], id='g'+(uid++);
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(topic)}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#${id})"/>${art}</svg>`;
}
// a picture from another site may fail to load: then the topic cover takes its place
const pic = it => it.img ? `<img src="${it.img}" alt="${esc(it.title)}" data-f="${esc(cover(it.topic))}" onerror="this.outerHTML=this.dataset.f">` : cover(it.topic);
const exTag = it => (it.own ? '<span class="ex own">ваша</span>' : it.ex ? '<span class="ex">приклад</span>' : '');
function rel(it){ const n=days(it.date); return n===0?'сьогодні':n===1?'завтра':'через '+n+' дн.'; }
// the place opens in Google Maps: search by the address line, so the map shows the place itself
const gmaps = it => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.place||'');
function endStr(it){ if(it.d2){ const e=new Date(it.d2+'T12:00'); return ` – ${e.getDate()} ${MONS2[e.getMonth()]}${yr(e)}`+(it.t2?` ${it.t2}`:''); } return it.t2?`–${it.t2}`:''; }
function whenShort(it){ const d=it.date; return `${WDS[d.getDay()]}, ${d.getDate()} ${MONS2[d.getMonth()]}${yr(d)}`+(it.t?` · ${it.t}`:'')+endStr(it); }

function evHTML(it){
  return `<button class="ev" data-act="open" data-i="${ITEMS.indexOf(it)}"><div class="thumb">${pic(it)}</div>
   <div style="min-width:0"><div class="when">${it.fut?`<b>${rel(it)}</b> · `:''}${esc(whenShort(it))}</div>
   <h4>${esc(it.title)}${exTag(it)}</h4><div class="pl">${esc(it.place)}</div></div></button>`;
}
function lists(){
  const all=ITEMS.filter(it=>match(it));
  return {all, fut:all.filter(i=>i.fut).sort((a,b)=>a.date-b.date), past:all.filter(i=>!i.fut).sort((a,b)=>b.date-a.date)};
}
const emptyHTML = '<div class="none">За цими фільтрами нічого немає. Спробуйте прибрати тему або обрати інше місце.</div>';
const todayStr = `Сьогодні, ${TODAY.getDate()} ${MON[TODAY.getMonth()]}`;
// a date line before each new day in the feed; today's items sit right under the «Сьогодні» line, shown only when there are any
function dayLabel(d){ const n=days(d), w=n===1?'Завтра':n===-1?'Вчора':WD[d.getDay()][0].toUpperCase()+WD[d.getDay()].slice(1); return `${w}, ${d.getDate()} ${MON[d.getMonth()]}${yr(d)}`; }
function byDay(items){ let last=''; return items.map(it=>{ const k=it.date.toDateString(), head = k!==last && days(it.date)!==0 ? `<div class="today day"><b>${dayLabel(it.date)}</b></div>` : ''; last=k; return head+evHTML(it); }).join(''); }

let slideN=0;
function bannerHTML(){
  return `<section class="banner" aria-roledescription="carousel" aria-label="Оголошення">`+SLIDES.map((s,i)=>`<div class="slide${i===slideN?' on':''}" style="background:${s.bg}" aria-hidden="${i!==slideN}"><div class="art"><img src="${s.img}" alt=""></div><div class="tx"><span class="tag${s.old?' sale':''}">${esc(s.tag)}</span><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p><div class="buy"><a class="go" href="${s.href}" target="_blank" rel="noopener" tabindex="${i===slideN?0:-1}">Купити</a><span class="pr">${esc(s.pr)}${s.old?` <s>${esc(s.old)}</s>`:''}</span></div></div><span class="ad">shop.apostol.ua</span></div>`).join('')
   +`<button class="bnav prev" data-slide="-1" aria-label="Попереднє">‹</button><button class="bnav next" data-slide="1" aria-label="Наступне">›</button>`
   +`<div class="dots">`+SLIDES.map((_,i)=>`<button data-dot="${i}" aria-label="Оголошення ${i+1}" aria-current="${i===slideN}"></button>`).join('')+`</div></section>`;
}
function showSlide(n){
  const bn=document.querySelector('.banner'),prev=slideN;
  slideN=(n+SLIDES.length)%SLIDES.length;
  if(slideN===prev)return;
  bn.classList.toggle('back',n<prev);void bn.offsetWidth;
  document.querySelectorAll('.slide').forEach((el,i)=>{el.classList.toggle('out',i===prev);el.classList.toggle('on',i===slideN);el.setAttribute('aria-hidden',i!==slideN);el.querySelector('.go').tabIndex=i===slideN?0:-1;});
  document.querySelectorAll('.dots button').forEach((el,i)=>el.setAttribute('aria-current',i===slideN));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-slide],[data-dot]');if(!b)return;
  showSlide(b.dataset.dot!==undefined?+b.dataset.dot:slideN+ +b.dataset.slide);});
document.addEventListener('animationend',e=>{if(e.animationName==='fill')showSlide(slideN+1);});
const logoHTML=()=>`<a class="logo" href="#">apostol<span class="u">.ua</span></a>`;

// on phones the filters cover the feed: one button shows how many items match and goes back to them
const nWord = n => n%10===1&&n%100!==11 ? 'подію' : [2,3,4].includes(n%10)&&![12,13,14].includes(n%100) ? 'події' : 'подій';
const showBtn = () => { if (S.lit){ const n=litCount(); return `<button type="button" class="btn showres" data-act="showres">${n?`Показати ${n} ${n%10===1&&n%100!==11?'Літургію':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'Літургії':'Літургій'}`:'Нічого не знайдено'}</button>`; } const n=ITEMS.filter(it=>match(it)).length; return `<button type="button" class="btn showres" data-act="showres">${n?`Показати ${n} ${nWord(n)}`:'Нічого не знайдено'}</button>`; };
function sideWrap(inner){
  return `<button class="ftoggle" data-act="side" aria-expanded="${S.side}">Фільтри${activeN()?' ('+activeN()+')':''}</button><aside class="side${S.side?' open':''}">${inner}${showBtn()}</aside>`;
}
function page(){
  const L=lists();
  let feed = `<div><input class="search" id="q" type="search" aria-label="Пошук" placeholder="Пошук: реколекції, прощі, святий Миколай…" value="${esc(S.q)}">${chipsHTML()}</div>`;
  if (S.lit) feed += litHTML();
  else if (!L.all.length) feed += emptyHTML;
  else {
    const sec = (h, items) => `<section><div class="sec-h"><h2>${h}</h2></div><div class="list">${items.filter(i=>i.promo).map(evHTML).join('')}${items.some(i=>!i.promo&&days(i.date)===0)?`<div class="today"><b><i></i>${todayStr}</b></div>`:''}${byDay(items.filter(i=>!i.promo))}</div></section>`;
    if (L.fut.length) feed += sec('Анонси', L.fut);
    if (L.past.length) feed += sec('Новини', L.past);
  }
  return `<header class="bar"><div class="wrap">${logoHTML()}
     <nav>${LIVE?'':`<button class="theme rv" type="button" data-act="review" aria-label="На перевірку" title="На перевірку (редактор)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>${QUEUE.length?`<b>${QUEUE.length}</b>`:''}</button>`}<button class="theme" id="theme" type="button" aria-label="Світла або темна тема" title="Світла / темна тема"><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="btn" data-act="new" aria-label="Створити подію" title="Створити подію">+<span class="sm"> Створити</span><span class="lg"> подію</span></button>${LIVE?'':`<button class="theme acct${ACC.who!=='guest'?' on':''}" type="button" data-act="acct" aria-label="${ACC.who==='guest'?'Увійти або зареєструватися':'Ваш обліковий запис'}" title="${ACC.who==='guest'?'Увійти або зареєструватися':'Ваш обліковий запис'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>`}</nav></div></header>
   <div class="wrap"><h1 class="sr">Події та новини Церкви</h1>${bannerHTML()}</div>
   <div class="wrap main"><div>${sideWrap(filtersHTML())}</div><main class="feed">${feed}</main></div>`;
}
function render(){

// duplicate and conflict checks for a new event
const norm = t => t.toLowerCase().replace(/[^0-9a-zа-щьюяґєії]+/gi,' ').trim();
// quick submissions (link / text / files) have no parish or date yet, so they never match here
const sameParish = (a,b) => !!(a.path && b.path) && a.path.join('/')===b.path.join('/');
const days2 = it => [it.d, it.d2||it.d];
const datesMeet = (a,b) => { const [a1,a2]=days2(a), [b1,b2]=days2(b); return a1<=b2 && b1<=a2; };
// times overlap; an event without an end lasts 2 hours; without a time it may be any time that day
const mins = t => t ? +t.slice(0,2)*60 + +t.slice(3) : null;
function overlap(a,b){
  if (!datesMeet(a,b)) return false;
  if (a.d2||b.d2||!a.t||!b.t) return true;
  const s1=mins(a.t), e1=a.t2?mins(a.t2):s1+120, s2=mins(b.t), e2=b.t2?mins(b.t2):s2+120;
  return s1<e2 && s2<e1;
}
// same parish, days meet, and the titles match after cleaning (one may contain the other)
function isDup(it,b){ if(!sameParish(it,b)||!datesMeet(it,b)) return false; const x=norm(it.title), y=norm(b.title); return x===y || (Math.min(x.length,y.length)>=8 && (x.includes(y)||y.includes(x))); }
function setErr(id, text){ const w=document.getElementById(id); w.classList.toggle('bad', !!text); w.querySelector('.msg').textContent=text||''; return !text; }
function submitCreate(){
  const v = id => document.getElementById(id).value.trim();
  const title=v('cf-title'), date=v('cf-date'), par=v('cf-par'), topic=v('cf-topic'), src=v('cf-src');
  let ok = true;
  ok = setErr('w-title', title.length<5 ? 'Напишіть назву, хоча б 5 літер.' : '') && ok;
  ok = setErr('w-date', !date ? 'Виберіть дату початку.' : new Date(date+'T12:00')<TODAY ? 'Дата вже минула. Анонс має бути на майбутнє.' : '') && ok;
  const date2=v('cf-date2'), t1=v('cf-time'), t2=v('cf-time2');
  ok = setErr('w-date2', date2 && date && date2<date ? 'Завершення не може бути раніше за початок.' : '') && ok;
  ok = setErr('w-time2', t2 && t1 && (!date2||date2===date) && t2<=t1 ? 'Час завершення має бути пізніше за початок.' : '') && ok;
  ok = setErr('w-par', !par ? 'Виберіть організатора.' : '') && ok;
  const org=v('cf-org'), isNew=par==='new';
  ok = setErr('w-org', isNew && org.length<3 ? 'Напишіть назву організатора.' : '') && ok;
  ok = setErr('w-topic', !topic ? 'Виберіть тему.' : '') && ok;
  ok = setErr('w-src', src && !/^https?:\/\/[^\s"'<>]+\.[^\s"'<>]+$/.test(src) ? 'Посилання має починатися з https://' : '') && ok;
  const reg=v('cf-reg');
  ok = setErr('w-reg', reg && !/^https:\/\/[^\s"'<>]+\.[^\s"'<>]+$/.test(reg) ? 'Посилання на форму має починатися з https://' : '') && ok;
  // a guest leaves a contact so the editor can ask about missing details or explain a refusal
  const mailEl=document.getElementById('cf-mail'), mail=mailEl?mailEl.value.trim():'';
  if (mailEl) ok = setErr('w-mail', !/^\S+@\S+\.\S+$/.test(mail) && mail.replace(/\D/g,'').length<7 ? 'Напишіть email або телефон, щоб редакція могла з вами зв’язатися.' : '') && ok;
  const mine={d:date, d2:date2, t:t1, t2, path:isNew?null:par.split('/'), title};
  const orig = F.edit!=null ? ITEMS[F.edit] : null;
  if (ok && orig && F.img===(orig.img||'') && document.getElementById('cf-access').checked===!!orig.access && FIELDS.every(id=>(F.draft[id]||'')===(document.getElementById(id).value||'').trim())) ok = setErr('w-title','Ви нічого не змінили.');
  const dupL=ITEMS.find(it=>it!==orig&&isDup(it,mine)), dupQ=QUEUE.find(it=>it!==F.asEditor&&it.editOf==null&&isDup(it,mine));
  if (ok && dupL) ok = setErr('w-title', `Схоже, ця подія вже є у стрічці: «${dupL.title}», ${whenShort(dupL)}.`);
  if (ok && dupQ) ok = setErr('w-title', 'Цю подію вже надіслано, вона чекає на перевірку.');
  // same parish, same time, different event: warn once, a second press confirms
  const clash = ok && [...ITEMS,...QUEUE].find(it=>it!==orig&&it!==F.asEditor&&it.editOf==null&&sameParish(it,mine)&&overlap(it,mine));
  const key = clash ? clash.title+'|'+date+'|'+t1 : '';
  if (clash && F.warned!==key){ F.warned=key; ok = setErr('w-date', `У цій парафії в цей час уже є «${clash.title}» (${whenShort(clash)}). Якщо це інша подія, натисніть кнопку ще раз.`); }
  if (!ok) return;
  // a new organizer is not in the list yet, so its event always goes to the editor
  const path=isNew?null:par.split('/'), parish=isNew?org:PLACES[path[0]].c[path[1]].p[path[2]];
  const it={d:date, t:t1, d2:date2&&date2!==date?date2:'', t2, path, org:isNew?org:'', topic, title, text:v('cf-text'), cost:v('cf-cost'), lang:v('cf-lang'), contact:v('cf-contact'), access:document.getElementById('cf-access').checked?1:0, form: reg || (orig&&orig.form==='example' ? 'example' : ''), own:1, img:F.img,
    place: v('cf-place') || (isNew ? org : parish+', '+PLACES[path[0]].c[path[1]].n), src: !src ? null : orig&&orig.src&&orig.src[1]===src ? orig.src : [src.replace(/^https?:\/\//,'').split('/')[0], src],
    date:new Date(date+'T12:00'), fut:true};
  clearDraft('cf'); F.img='';
  document.getElementById('create').close();
  if (orig){
    if (canEdit()){ const {own,...ch}=it, what='Змінено: '+changed(orig,ch); Object.assign(orig, ch); (orig.hist=orig.hist||[]).push({d:'29.10.2026', who:parishName(orig.path.join('/')), what}); render(); toast('Зміни збережено.'); }
    else { QUEUE.push({...it, mail, by:sender(mail), editOf:F.edit}); render(); toast('Правку надіслано. Редактор перевірить і внесе її в подію.'); }
    F.edit=null; return;
  }
  const fromQ=F.asEditor; F.asEditor=null;
  if (fromQ) QUEUE.splice(QUEUE.indexOf(fromQ),1);
  if (((ACC.who==='verified' && ACC.orgs.includes(par)) || fromQ) && !isNew){ ITEMS.push(it); render(); toast('Подію опубліковано.'); }
  else { QUEUE.push(fromQ ? {...it, by:fromQ.by} : {...it, mail, by:sender(mail)}); render(); toast(fromQ ? 'Організатора ще немає в списку: подія чекає в «На перевірку», там виберіть місто.' : 'Анонс надіслано. Він з’явиться у стрічці після перевірки редактором.'); }
}

function routeHTML(ll, name){
  const g=`https://www.google.com/maps/dir/?api=1&destination=${ll[0]},${ll[1]}`, a=`https://maps.apple.com/?daddr=${ll[0]},${ll[1]}&q=${encodeURIComponent(name)}`;

}
// dark-theme colours for the Google map (light theme uses Google's own look)
const DARK_MAP=[{elementType:'geometry',stylers:[{color:'#2b2b2b'}]},{elementType:'labels.text.fill',stylers:[{color:'#a0a0a0'}]},{elementType:'labels.text.stroke',stylers:[{color:'#2b2b2b'}]},
  {featureType:'road',elementType:'geometry',stylers:[{color:'#3c3c3c'}]},{featureType:'road',elementType:'labels.icon',stylers:[{visibility:'off'}]},
  {featureType:'water',elementType:'geometry',stylers:[{color:'#1b1b1b'}]},{featureType:'poi',stylers:[{visibility:'off'}]},{featureType:'transit',stylers:[{visibility:'off'}]},
  {featureType:'administrative',elementType:'geometry.stroke',stylers:[{color:'#555555'}]}];
function drawMap(id, big){
  const el=document.getElementById(id); if (!el) return;
  el.parentElement.querySelector('.mnote')?.remove();
  if (MAPS.failed){ el.insertAdjacentHTML('afterend', `<div class="mnote">Карта Google не завантажилась.</div>`); return; }
  if (!window.google?.maps) return; // the Google script is still loading; mapsReady() draws the map when it arrives
  const dark=document.documentElement.dataset.theme==='dark', css=getComputedStyle(document.documentElement);
  const map=new google.maps.Map(el, {disableDefaultUI:true, zoomControl:big, gestureHandling:big?'greedy':'none', keyboardShortcuts:big, clickableIcons:false,
    styles:dark?DARK_MAP:null, backgroundColor:css.getPropertyValue('--card-2').trim()});
  MAPS[id]=map;
  // one point per place; a place with several events lists them all
  const pts=new Map();
  onMap().forEach(it=>{ const ll=geoOf(it), k=ll.join(); if(!pts.has(k)) pts.set(k,{ll, items:[]}); pts.get(k).items.push(it); });
  const blue=css.getPropertyValue('--blue').trim(), info=new google.maps.InfoWindow(), bounds=new google.maps.LatLngBounds();
  pts.forEach(({ll,items})=>{
    const pos={lat:ll[0], lng:ll[1]}; bounds.extend(pos);
    const mk=new google.maps.Marker({position:pos, map, clickable:big, title:big?items[0].place:'',

    if (big) mk.addListener('click', ()=>{ info.setContent(`<div class="pop">${items.map(it=>`<div class="pe"><span>${esc(whenShort(it))}</span><button type="button" data-act="open" data-i="${ITEMS.indexOf(it)}">${esc(it.title)}</button></div>`).join('')}<div class="place">${esc(items[0].place)}</div>${routeHTML(ll, items[0].place)}</div>`); info.open({map, anchor:mk}); });
  });
  if (pts.size){ const max=big?15:12;
    map.fitBounds(bounds, big?60:18);

}
